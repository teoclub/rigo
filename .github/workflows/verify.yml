name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install

      # Issue 003 AC: the minimal workspace installs under Node 24 too. npm's
      # own lockfile is not shipped (bun is the package manager), so a clean
      # copy proves `npm install` resolves the same tree (plain install, not
      # --workspaces: that flag skips the root's own devDependencies).
      - name: Install (Node 24, npm, clean copy)
        run: |
          mkdir -p /tmp/rigo-npm-clean
          tar --exclude='node_modules' --exclude='.git' --exclude='*.tsbuildinfo' -cf - . | (cd /tmp/rigo-npm-clean && tar xf -)
          npm install --prefix /tmp/rigo-npm-clean --ignore-scripts --no-audit --no-fund

      # Source audit (Issue 002) verifies KEEP files stay rewrite-identical to
      # the pinned upstream commit; verify-baseline re-resolves the pinned
      # tag. Provide a clone at the pinned baseline for both.
      - name: Prepare pinned upstream clone
        run: |
          git init -q /tmp/dsh-upstream
          git -C /tmp/dsh-upstream remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C /tmp/dsh-upstream fetch --depth 1 origin refs/tags/dsh-v0.1.1-rc.2:refs/tags/dsh-v0.1.1-rc.2
          git -C /tmp/dsh-upstream checkout -q FETCH_HEAD
          echo "RIGO_UPSTREAM_CLONE=/tmp/dsh-upstream" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

      # Dual-runtime compatibility suites (SPEC §9.2, Issue 036).
      - name: Test (Node 24, vitest)
        run: bun run test
      - name: Test (Bun)
        run: bun test ./tests/upstream ./tests/integration

      # Baseline, source-audit, packaging, boundary and compatibility-matrix
      # gates (Issues 001/002/003/035) - failures block the merge.
      - name: Verify gates
        run: bun run verify
